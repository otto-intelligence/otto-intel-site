<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · OttO Intelligence</title>
<meta name="description" content="Lo que dicen los negocios que trabajan con OttO Intelligence en Puerto Vallarta.">
<link rel="canonical" href="https://otto-intel.com/clientes/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OttO Intelligence">
<meta property="og:url" content="https://otto-intel.com/clientes/">
<meta property="og:title" content="Clientes · OttO Intelligence">
<meta property="og:description" content="Lo que dicen los negocios que trabajan con OttO Intelligence.">
<meta property="og:image" content="https://otto-intel.com/otto-mark.png">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* Canonical pairing from otto-intel-brand-spec.md: Tinta on Papel.
     Ámbar is too light to carry text on Papel (2.88:1), so Óxido carries
     every text accent and the CTA; Ámbar stays in hairlines and glow. */
  --papel:#F4EFE5;
  --tinta:#1A1A17;
  --ambar:#C97A4A;
  --ocre:#B89752;
  --oxido:#A04E2C;
  --ink:var(--tinta);
  --ink-soft:#5E5850;   /* AA on Papel */
  --gut:clamp(20px,5vw,80px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--papel); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:clamp(15px,1.05vw,17px); line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
p{margin:0; text-wrap:pretty}
a{color:inherit}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--papel); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:clamp(15px,1.05vw,17px); line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden}
p{margin:0; text-wrap:pretty}
a{color:inherit}
.field{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#wire{position:absolute; inset:0; width:100%; height:100%; opacity:.95}
@media (max-width:860px){ #wire{opacity:.55} }
.field i{position:absolute; display:block; border-radius:50%}
.f1{width:76vw; height:76vw; left:-22vw; top:-14vw;
    background:radial-gradient(circle,color-mix(in oklab,var(--ambar) 11%,transparent) 0%,transparent 68%)}
.f2{width:54vw; height:54vw; right:-16vw; bottom:-18vw;
    background:radial-gradient(circle,color-mix(in oklab,var(--ocre) 9%,transparent) 0%,transparent 66%)}
.grid{position:absolute; inset:0;
  background-image:
    linear-gradient(color-mix(in oklab,var(--tinta) 5%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in oklab,var(--tinta) 5%,transparent) 1px,transparent 1px);
  background-size:clamp(70px,7vw,110px) clamp(70px,7vw,110px);
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}


.home{position:absolute; top:clamp(14px,2.4vh,26px); left:var(--gut); z-index:3; display:flex;
  align-items:center; gap:10px; text-decoration:none; font-family:"DM Sans",sans-serif; font-weight:700; font-size:16px}
.home svg{width:40px; height:auto}
.home span span{font-weight:400; letter-spacing:.06em; opacity:.82}
main{position:relative; z-index:1; min-height:100svh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  padding:clamp(96px,14vh,140px) var(--gut) clamp(48px,8vh,96px)}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; color:var(--oxido); margin-top:clamp(26px,4vh,40px)}
main > .eyebrow{margin-top:0}
h1{font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:clamp(34px,4.4vw,58px);
  line-height:1.06; letter-spacing:-.018em; margin:14px 0 0; text-wrap:balance}
h1 em{font-style:italic; color:var(--oxido)}
.btn{display:inline-flex; align-items:center; justify-content:center;
  margin-top:clamp(30px,4.6vh,48px);
  padding:12px 24px; border-radius:999px; background:var(--oxido);
  color:var(--papel); font-size:14.5px; font-weight:600; letter-spacing:.005em;
  text-decoration:none; white-space:nowrap; transition:transform .2s, background .2s}
.btn:hover{background:#8C4224; transform:translateY(-1px)}
/* ── top-right nav + client quotes ───────────────────────────────── */
.topnav{position:absolute; top:clamp(14px,2.4vh,26px); right:var(--gut); z-index:3;
  display:flex; align-items:center; gap:clamp(14px,1.8vw,22px); font-size:13.5px; font-weight:500}
.topnav a{text-decoration:none; color:var(--ink)}
.topnav a.link:hover{color:var(--oxido)}
.topnav .pill{padding:7px 15px; border-radius:999px; background:var(--oxido); color:var(--papel)}
.topnav .pill:hover{background:#8C4224}
.quotes{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
  gap:clamp(16px,2vw,24px); margin:clamp(30px,4.6vh,46px) auto 0; max-width:640px; text-align:left}
.quote{margin:0; padding:clamp(22px,3vw,32px); border:1px solid color-mix(in oklab,var(--ambar) 45%,transparent);
  border-radius:14px; background:color-mix(in oklab,var(--papel) 82%,#fff); display:flex; flex-direction:column; gap:18px}
.quote img{height:24px; width:auto; align-self:flex-start; mix-blend-mode:multiply}
.quote blockquote{margin:0; font-family:"Instrument Serif",Georgia,serif;
  font-size:clamp(21px,2vw,26px); line-height:1.3; text-wrap:pretty}
.quote figcaption{font-size:13px; color:var(--ink-soft)}
.quote figcaption b{color:var(--ink); font-weight:600}

footer{margin-top:clamp(40px,7vh,76px); display:flex; flex-direction:column;
  align-items:center; gap:12px; font-size:12.5px; color:var(--ink-soft)}
footer a{text-decoration:none; border-bottom:1px solid color-mix(in oklab,var(--oxido) 50%,transparent)}
footer a:hover{color:var(--ink)}
.lang{display:flex; gap:5px}
.lang button{background:none; border:1px solid color-mix(in oklab,var(--tinta) 24%,transparent);
  color:var(--ink-soft); font:inherit; font-size:11px; padding:4px 10px;
  border-radius:99px; cursor:pointer; letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--oxido); color:var(--papel);
  border-color:var(--oxido)}

</style>
</head>
<body>

<div class="field" aria-hidden="true"><div class="grid"></div><i class="f1"></i><i class="f2"></i></div>

<a class="home" href="/" aria-label="OttO Intelligence — inicio">
  <svg viewBox="0 0 320 200" aria-hidden="true">
    <circle cx="70" cy="70" r="50" stroke="#1A1A17" stroke-width="17" fill="none"/>
    <circle cx="250" cy="70" r="50" stroke="#1A1A17" stroke-width="17" fill="none"/>
    <path d="M 109 39 Q 160 31 211 39" stroke="#1A1A17" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M 152 150 Q 178 170 204 152 T 214 136" stroke="#1A1A17" stroke-width="14" stroke-linecap="round" fill="none"/>
  </svg>
  <span>OttO<span> INTELLIGENCE</span></span>
</a>

<nav class="topnav" aria-label="Principal">
  <a class="link" href="/" data-es="Inicio" data-en="Home">Inicio</a>
  <a class="pill" href="https://calendar.app.google/1iwp2jQMvfQu6sW6A" target="_blank" rel="noopener"
     data-es="Agenda" data-en="Book">Agenda</a>
</nav>

<main>
  <p class="eyebrow" data-es="Clientes" data-en="Clients">Clientes</p>
  <h1 data-es="Lo que dicen <em>nuestros clientes.</em>" data-en="What <em>our clients say.</em>">Lo que dicen <em>nuestros clientes.</em></h1>
  <div class="quotes">
    <figure class="quote">
      <img src="/img/83grados-logo.jpg" alt="83grados Estudio del Té" width="283" height="24">
      <blockquote data-es="“Antes de proponer nada, nos preguntaron cómo trabajamos. Queríamos un punto de venta que se adaptara al estudio, no al revés: ventas, gastos y corte de caja en un solo lugar, y nada que no usemos.”"
                  data-en="“Before proposing anything, they asked how we work. We wanted a point of sale that fit the studio, not the other way around: sales, expenses and cash closing in one place, and nothing we don’t use.”">“Antes de proponer nada, nos preguntaron cómo trabajamos. Queríamos un punto de venta que se adaptara al estudio, no al revés: ventas, gastos y corte de caja en un solo lugar, y nada que no usemos.”</blockquote>
      <figcaption data-es="<b>[NOMBRE]</b>, socio · 83grados Estudio del Té" data-en="<b>[NAME]</b>, partner · 83grados Estudio del Té"><b>[NOMBRE]</b>, socio · 83grados Estudio del Té</figcaption>
    </figure>
  </div>
  <a class="btn" href="https://calendar.app.google/1iwp2jQMvfQu6sW6A" target="_blank" rel="noopener"
     data-es="Agenda una sesión de 45 min" data-en="Book a 45-min session">Agenda una sesión de 45 min</a>
  <footer>
    <span>OttO Intelligence · Puerto Vallarta · <a href="mailto:contact@otto-intel.com">contact@otto-intel.com</a></span>
    <div class="lang">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </footer>
</main>

<script>
(function(){
  var btns = [].slice.call(document.querySelectorAll('.lang button'));
  function setLang(l){
    document.documentElement.lang = l;
    document.querySelectorAll('[data-' + l + ']').forEach(function(el){ el.innerHTML = el.getAttribute('data-' + l); });
    btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    try { localStorage.setItem('otto-lang', l); } catch(e) {}
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.lang); }); });
  try { if (localStorage.getItem('otto-lang') === 'en') setLang('en'); } catch(e) {}
})();
</script>
</body>
</html>
