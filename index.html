<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otto Intel</title>
  <meta name="description" content="Soluciones para tu negocio. Sin humo. IA cuando es necesario.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1A17;
      --paper: #F4EFE5;
      --amber: #C97A4A;
      --muted: #9a9488;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      text-align: center;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .logo { width: 132px; height: auto; }
    .tagline {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .rule { width: 56px; height: 2px; background: var(--amber); border: none; }
    .statement {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.3;
      color: var(--ink);
      max-width: 480px;
    }
    .cta {
      display: inline-block;
      font-size: 15px;
      font-weight: 600;
      color: var(--paper);
      background: var(--amber);
      padding: 13px 28px;
      border-radius: 999px;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .cta:hover { opacity: 0.88; }
    footer {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }
    .lang { display: flex; gap: 8px; font-size: 12px; }
    .lang button {
      background: none; border: none; cursor: pointer;
      font: inherit; color: var(--muted); padding: 2px 4px;
    }
    .lang button.active { color: var(--ink); font-weight: 500; }
    .lang span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 700 360" fill="none" aria-label="Otto Intel" role="img">
      <circle cx="160" cy="150" r="100" stroke="#1A1A17" stroke-width="14"></circle>
      <path d="M 260 150 Q 350 126 440 150" stroke="#1A1A17" stroke-width="14" stroke-linecap="round" fill="none"></path>
      <circle cx="540" cy="150" r="100" stroke="#1A1A17" stroke-width="14"></circle>
      <path d="M 334 255 Q 372 283 410 259 T 424 237" stroke="#1A1A17" stroke-width="10.5" stroke-linecap="round" fill="none"></path>
    </svg>

    <p class="tagline">te mira&nbsp;·&nbsp;entiende&nbsp;·&nbsp;trabaja por ti</p>

    <hr class="rule">

    <p class="statement" data-es="Soluciones para tu negocio. Sin humo. IA cuando es necesario." data-en="Solutions for your business. No hype. AI when it's needed.">Soluciones para tu negocio. Sin humo. IA cuando es necesario.</p>

    <a class="cta" href="mailto:contact@otto-intel.com" data-es="Hablemos" data-en="Let's talk">Hablemos</a>

    <footer>
      <div>Otto Intel · Puerto Vallarta</div>
      <div class="lang">
        <button data-lang="es" class="active">ES</button>
        <span>·</span>
        <button data-lang="en">EN</button>
      </div>
    </footer>
  </main>

  <script>
    const buttons = document.querySelectorAll('.lang button');
    function setLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });
      buttons.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    buttons.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  </script>
</body>
</html>
