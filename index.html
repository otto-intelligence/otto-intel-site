<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OttO Intelligence</title>
<meta name="description" content="Soluciones para tu negocio. Sin humo. IA cuando es necesario.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* Canonical pairing from otto-intel-brand-spec.md: Tinta on Papel.
     Ámbar is too light to carry text on Papel (2.88:1), so Óxido carries
     every text accent and the CTA; Ámbar stays in hairlines and glow. */
  --papel:#F4EFE5;
  --tinta:#1A1A17;
  --ambar:#C97A4A;
  --ocre:#B89752;
  --oxido:#A04E2C;
  --ink:var(--tinta);
  --ink-soft:#5E5850;   /* AA on Papel */
  --gut:clamp(20px,5vw,80px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--papel); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:clamp(15px,1.05vw,17px); line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
p{margin:0; text-wrap:pretty}
a{color:inherit}

/* ── field: hairline grid, warm glow, and the dots ──────────────── */
.field{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#wire{position:absolute; inset:0; width:100%; height:100%; opacity:.95}
@media (max-width:860px){ #wire{opacity:.55} }
.field i{position:absolute; display:block; border-radius:50%}
.f1{width:76vw; height:76vw; left:-22vw; top:-14vw;
    background:radial-gradient(circle,color-mix(in oklab,var(--ambar) 11%,transparent) 0%,transparent 68%)}
.f2{width:54vw; height:54vw; right:-16vw; bottom:-18vw;
    background:radial-gradient(circle,color-mix(in oklab,var(--ocre) 9%,transparent) 0%,transparent 66%)}
.grid{position:absolute; inset:0;
  background-image:
    linear-gradient(color-mix(in oklab,var(--tinta) 5%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in oklab,var(--tinta) 5%,transparent) 1px,transparent 1px);
  background-size:clamp(70px,7vw,110px) clamp(70px,7vw,110px);
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}

/* ── the one screen ─────────────────────────────────────────────── */
main{position:relative; z-index:1; min-height:100svh; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:clamp(48px,8vh,96px) var(--gut)}
.brand{display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2vh,20px)}
.logo{width:clamp(118px,13vw,164px); height:auto; display:block}
.wordmark{font-family:"DM Sans",sans-serif; font-weight:700;
  font-size:clamp(22px,2.2vw,28px); letter-spacing:.01em}
.wordmark span{font-weight:400; letter-spacing:.06em; opacity:.82}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.2em;
  text-transform:uppercase; color:var(--oxido); margin-top:clamp(26px,4vh,40px)}
.rule{width:56px; height:1px; border:0; background:var(--ambar);
  margin:clamp(22px,3.4vh,34px) auto}
.statement{font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:clamp(32px,4.6vw,60px); line-height:1.06; letter-spacing:-.018em;
  max-width:17ch; text-wrap:balance}
.statement em{font-style:italic; color:var(--oxido)}
.btn{display:inline-flex; align-items:center; justify-content:center;
  margin-top:clamp(30px,4.6vh,48px);
  padding:12px 24px; border-radius:999px; background:var(--oxido);
  color:var(--papel); font-size:14.5px; font-weight:600; letter-spacing:.005em;
  text-decoration:none; white-space:nowrap; transition:transform .2s, background .2s}
.btn:hover{background:#8C4224; transform:translateY(-1px)}

footer{margin-top:clamp(40px,7vh,76px); display:flex; flex-direction:column;
  align-items:center; gap:12px; font-size:12.5px; color:var(--ink-soft)}
footer a{text-decoration:none; border-bottom:1px solid color-mix(in oklab,var(--oxido) 50%,transparent)}
footer a:hover{color:var(--ink)}
.lang{display:flex; gap:5px}
.lang button{background:none; border:1px solid color-mix(in oklab,var(--tinta) 24%,transparent);
  color:var(--ink-soft); font:inherit; font-size:11px; padding:4px 10px;
  border-radius:99px; cursor:pointer; letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--oxido); color:var(--papel);
  border-color:var(--oxido)}

/* ── reveal ─────────────────────────────────────────────────────── */
.r{opacity:0; transform:translateY(18px);
  transition:opacity .85s cubic-bezier(.22,1,.36,1), transform .85s cubic-bezier(.22,1,.36,1)}
.in .r{opacity:1; transform:none}
.r[data-d="1"]{transition-delay:.1s}
.r[data-d="2"]{transition-delay:.2s}
.r[data-d="3"]{transition-delay:.3s}
.r[data-d="4"]{transition-delay:.4s}

@media (prefers-reduced-motion:reduce){
  .r{opacity:1 !important; transform:none !important; transition:none}
}
</style>
</head>
<body>

<div class="field" aria-hidden="true">
  <div class="grid"></div>
  <canvas id="wire"></canvas>
  <i class="f1"></i><i class="f2"></i>
</div>

<main>
  <div class="brand r">
    <svg class="logo" viewBox="0 0 320 200" role="img" aria-label="OttO Intelligence">
      <circle cx="70" cy="70" r="50" stroke="#1A1A17" stroke-width="17" fill="none"/>
      <circle cx="250" cy="70" r="50" stroke="#1A1A17" stroke-width="17" fill="none"/>
      <path d="M 109 39 Q 160 31 211 39" stroke="#1A1A17" stroke-width="17" stroke-linecap="round" fill="none"/>
      <path d="M 152 150 Q 178 170 204 152 T 214 136" stroke="#1A1A17" stroke-width="14" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="wordmark">OttO<span> INTELLIGENCE</span></div>
  </div>

  <p class="eyebrow r" data-d="1"
     data-es="te mira · entiende · trabaja por ti"
     data-en="observes · understands · works for you">te mira · entiende · trabaja por ti</p>

  <hr class="rule r" data-d="1">

  <p class="statement r" data-d="2"
     data-es="Soluciones para tu negocio. Sin humo. <em>IA cuando es necesario.</em>"
     data-en="Solutions for your business. No hype. <em>AI when it’s needed.</em>">Soluciones para tu negocio. Sin humo. <em>IA cuando es necesario.</em></p>

  <a class="btn r" data-d="3" href="https://calendar.app.google/1iwp2jQMvfQu6sW6A" target="_blank" rel="noopener"
     data-es="Agenda una sesión" data-en="Book a session">Agenda una sesión</a>

  <footer class="r" data-d="4">
    <span>OttO Intelligence · Puerto Vallarta · <a href="mailto:contact@otto-intel.com">contact@otto-intel.com</a></span>
    <div class="lang">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </footer>
</main>

<script>
(function(){
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(function(){ document.body.classList.add('in'); });

  /* ── the dots ────────────────────────────────────────────────────
     Packets run the grid lanes with a trailing tail and never cross
     the words: every text element is a keep-out zone, re-measured as
     the page settles or resizes. */
  var cv = document.getElementById('wire');
  if (cv && !reduced) {
    var ctx = cv.getContext('2d'), DPR = Math.min(devicePixelRatio || 1, 2);
    var W = 0, H = 0, STEP = 0, packets = [], zones = [], zoneT = 0, last = 0;
    var OXIDO = '160,78,44', AMBAR = '201,122,74';
    var ZSEL = '.logo,.wordmark,.eyebrow,.statement,.btn,footer span,.lang';

    function measure(){
      zones = [];
      var els = document.querySelectorAll(ZSEL), pad = 22;
      for (var i = 0; i < els.length; i++) {
        var r = els[i].getBoundingClientRect();
        if (r.width < 4 || r.height < 4) continue;
        zones.push({x1: r.left - pad, y1: r.top - pad, x2: r.right + pad, y2: r.bottom + pad});
      }
    }
    function clear(x, y){
      for (var i = 0; i < zones.length; i++) {
        var z = zones[i];
        if (x > z.x1 && x < z.x2 && y > z.y1 && y < z.y2) return false;
      }
      return true;
    }
    function spawn(){
      var horiz = Math.random() < .5;
      var lane = (1 + Math.floor(Math.random() * Math.max(1, Math.floor((horiz ? H : W) / STEP) - 1))) * STEP;
      var dir = Math.random() < .5 ? 1 : -1;
      return {horiz: horiz, lane: lane, dir: dir,
        p: dir > 0 ? -Math.random() * W : (horiz ? W : H) + Math.random() * W,
        sp: 34 + Math.random() * 46,
        tone: Math.random() < .38 ? AMBAR : OXIDO};
    }
    function build(){
      STEP = parseFloat(getComputedStyle(document.querySelector('.grid')).backgroundSize) || 90;
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * DPR; cv.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      packets = [];
      var want = Math.max(18, Math.min(40, Math.round(W * H / 30000)));
      for (var k = 0; k < want; k++) packets.push(spawn());
      measure();
    }
    function loop(t){
      var dt = Math.min(.05, (t - last) / 1000) || .016; last = t;
      zoneT -= dt; if (zoneT <= 0) { measure(); zoneT = .25; }
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for (var i = 0; i < packets.length; i++) {
        var q = packets[i];
        q.p += q.dir * q.sp * dt;
        var span = q.horiz ? W : H;
        if (q.p < -80 || q.p > span + 80) { packets[i] = spawn(); continue; }
        var x = q.horiz ? q.p : q.lane, y = q.horiz ? q.lane : q.p;
        var tx = q.horiz ? q.p - q.dir * 46 : q.lane, ty = q.horiz ? q.lane : q.p - q.dir * 46;
        if (!clear(x, y) || !clear(tx, ty) || !clear((x + tx) / 2, (y + ty) / 2)) continue;
        var g = ctx.createLinearGradient(tx, ty, x, y);
        g.addColorStop(0, 'rgba(' + q.tone + ',0)');
        g.addColorStop(1, 'rgba(' + q.tone + ',.72)');
        ctx.strokeStyle = g; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
        ctx.fillStyle = 'rgba(' + q.tone + ',.95)';
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.283); ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    build();
    addEventListener('resize', build, {passive: true});
    requestAnimationFrame(function(t){ last = t; requestAnimationFrame(loop); });
  }

  /* bilingual. Spanish default. */
  var btns = [].slice.call(document.querySelectorAll('.lang button'));
  function setLang(l){
    document.documentElement.lang = l;
    document.querySelectorAll('[data-' + l + ']').forEach(function(el){
      el.innerHTML = el.getAttribute('data-' + l);
    });
    btns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.lang); }); });
})();
</script>
</body>
</html>
